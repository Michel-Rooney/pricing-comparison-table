<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Comparison Table</title>

    <meta
      name="description"
      content="Comparação de planos e preços em uma tabela simples e visualmente clara."
    />
    <meta
      name="keywords"
      content="pricing, comparison table, plans, pricing comparison, tabela de preços, HTML, CSS"
    />
    <meta name="author" content="Michel Rooney" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="Pricing Comparison Table" />
    <meta
      property="og:description"
      content="Comparação de planos e preços em uma tabela simples e visualmente clara."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://michel-rooney.github.io/pricing-comparison-table/"
    />
    <meta
      property="og:image"
      content="https://michel-rooney.github.io/pricing-comparison-table/pricing-comparison-table.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pricing Comparison Table" />
    <meta
      name="twitter:description"
      content="Comparação de planos e preços em uma tabela simples e visualmente clara."
    />
    <meta
      name="twitter:image"
      content="https://michel-rooney.github.io/pricing-comparison-table/pricing-comparison-table.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Handlee&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Handlee",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        line-height: 1.5;

        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      table {
        border-collapse: collapse;
      }

      table caption {
        font-size: 1.5rem;
        margin-bottom: 12px;
      }

      table,
      th,
      td {
        border: 1px solid black;
      }

      th,
      td {
        text-align: center;
        padding: 8px 32px;
      }

      table tbody th {
        font-weight: normal;
      }

      table tfoot {
        background-color: #f1f1f1;
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        Plan comparison
      </caption>
      <thead>
        <tr>
          <th scope="col">Plan</th>
          <th scope="col">Storage</th>
          <th scope="col">Projects</th>
          <th scope="col">Support</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Free</th>
          <td>5 G</td>
          <td>3</td>
          <td>Email</td>
        </tr>
        <tr>
          <th scope="row">Pro</th>
          <td>100 GB</td>
          <td>25</td>
          <td>Priority Email</td>
        </tr>
        <tr>
          <th scope="row">Bussines</th>
          <td>1 TB</td>
          <td>Unlimited</td>
          <td>24/7 Phone</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4">All plans include SSL and daily backups</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
